version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      expo:
        patterns:
          ['expo', 'expo-*', '@expo/*', 'react-native', 'react-native-*', '@react-native*/*']
      next-react:
        patterns: ['next', 'react', 'react-dom', '@types/react*']
      nest-prisma:
        patterns: ['@nestjs/*', 'prisma', '@prisma/*']
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ['*']
