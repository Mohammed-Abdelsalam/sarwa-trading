packages:
  - 'apps/*'
  - 'packages/*'

# Only these packages may run install scripts; pnpm blocks the rest.
onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma

overrides:
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': ~19.3.0
